name: CI

# Single-branch model: `feature/*` / `fix/*` → PR → `main`. There is no `dev` line, no container
# and no registry — this repository is a LIBRARY, and a release is an annotated `v*` tag handled
# by release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded PR run costs a runner slot something else needs. Cancel those — but never a
  # `main` push.
  #
  # ⚠️ THE SHA IN THE GROUP IS NOT DECORATION. For a push the expression below evaluates false,
  # and a FALSE `cancel-in-progress` does not mean "never cancelled": a group holds at most one
  # PENDING run, so on a shared group two merges inside one run's lifetime cancel the queued one
  # while it is still waiting — and that commit is never leak-scanned, linted or tested. Keying
  # push runs by SHA gives each commit its own group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ⭐ EVERY JOB HERE RUNS ON GITHUB-HOSTED RUNNERS, AND THAT IS A SECURITY DECISION, NOT A DEFAULT.
# Several sibling repositories run CI on the self-hosted fleet. They are all PRIVATE and take no
# outside fork PRs, which is the argument that makes it safe there. **This repository is PUBLIC**,
# so a `pull_request` from any fork would execute that fork's `pytest` — arbitrary code — on a
# persistent machine inside a private network. Do not move these jobs to the fleet.

jobs:
  # ⚠️ A JOB NAME IS A STATUS-CHECK CONTEXT. If `main` is ever given branch protection listing
  # these names, renaming one does not fail the check — the required context simply never reports
  # and every PR sits BLOCKED with green jobs and no explanation. Change the protection rule
  # first, then the name.
  #
  # ⭐ SO THE NAMES ARE WRITTEN DOWN HERE, because a required-context list is invisible from
  # inside the repository — you cannot read it from a clone, and nothing fails when it drifts.
  # The contexts this workflow publishes, exactly as GitHub sees them:
  #
  #   * "No internal info (leak guard)"
  #   * "Lint, type-check and test (py3.10)" and "Lint, type-check and test (py3.12)"
  #     (a matrix job's context carries its parameters, so BOTH are separate contexts)
  #   * "The built wheel installs and imports"
  #
  # `main` carries no branch protection today. That is recorded rather than assumed: this list is
  # what to protect WITH, and `test_the_required_status_check_names_are_recorded_in_the_workflow`
  # is what stops a rename silently invalidating it later.
  no-internal-info:
    name: No internal info (leak guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The COMMIT-RANGE scan below needs real history; the default shallow checkout has
          # none, and `git rev-list base..head` on it FAILS rather than silently scanning zero
          # commits (the script turns that failure into exit 1 on purpose).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # ⭐ THE GUARD IS INSTALLED, NOT INVOKED BY PATH — because that is how every consumer runs
      # it, and the repository that OWNS the engine must not be the one place it is used
      # differently. `pip install -e .` puts the `kw-leak-guard` console script on PATH, so this
      # job exercises the exact entry point a consumer's CI calls.
      - name: Install the package (the guard ships inside it)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Self-test the patterns, then scan the working tree
        # The self-test measures the SHIPPED patterns and reads no repository. The tree scan
        # reads this repository's own `.leakguard.json` — the injected configuration, exercised
        # on every run rather than only in a test.
        run: |
          kw-leak-guard --selftest
          kw-leak-guard
      # TWO DIFFERENT QUESTIONS, so two scans. The tree scan above answers "is the leak here
      # NOW", and it reads `git ls-files` — TRACKED files only. It is blind to a value committed
      # and then deleted, which stays permanently readable at the commit that added it.
      #
      # The range scan reads what each COMMIT added, so it sees that. Catching it before the
      # merge is the difference between an amend and a history rewrite across every clone.
      - name: Scan the commits being published
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu
          z40=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$z40" ]; then
            # The branch was created by this push, so there is no previous tip. Scan the commit
            # itself rather than reporting clean — "I could not work out a range" must never be
            # a pass, which is the one failure mode a leak guard cannot have.
            if git rev-parse --verify -q "${PUSH_HEAD}^" >/dev/null; then
              range="${PUSH_HEAD}^..${PUSH_HEAD}"
            else
              range="$PUSH_HEAD"   # root commit: scan all of it
            fi
          else
            range="$PUSH_BEFORE..$PUSH_HEAD"
          fi
          echo "range: $range"
          kw-leak-guard --range "$range"

  test:
    # ⭐ 3.10 AND 3.12, BOTH REQUIRED. `requires-python = ">=3.10"` is a promise to six consuming
    # repositories, and the 3.10/3.12 split has reddened fleet CI twice — a library that claims
    # 3.10 and is only ever run on 3.12 is claiming something nobody measured. The floor is not
    # cosmetic here: `datetime.fromisoformat` learned `Z` in 3.11, and this library writes `Z`
    # into its own records.
    name: Lint, type-check and test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a 3.10-only break must be visible even when 3.12 is red too
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned tooling
        # EXACT pins — a ruff patch can add a rule, and a linter that changes under an unchanged
        # tree reddens CI for reasons that have nothing to do with the commit. New tool versions
        # are adopted deliberately, as their own change.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==0.16.1" "mypy==2.3.0" "pytest==9.1.1" \
                                "pytest-timeout==2.4.0"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        # `-u` so output is unbuffered: a block-buffered stdout is what makes a hung run look
        # like a slow one. The per-test timeout lives in pyproject's `addopts`.
        run: python -u -m pytest

  # The install path a consumer actually uses. Everything above runs against the working tree
  # with an editable install; NONE of it would notice a `pyproject.toml` that does not package
  # the module — a missing `packages.find`, a wrong `where`, a module left out of the wheel.
  # That failure surfaces only at `pip install` time, in the consumer's repository, after the tag
  # has been cut.
  packaging:
    name: The built wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"  # the FLOOR: the version a consumer is most likely to break on
      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # ⭐ THE SDIST IS AN ARTIFACT TOO, and until this step nothing looked inside it. Three
      # properties, each of which has already been wrong once:
      #   * `tests/conftest.py` must be PRESENT — setuptools' default sdist takes `tests/test*.py`
      #     and not `conftest.py`, so the released tarball shipped tests without the autouse
      #     fixtures they depend on, including the one that makes "no test reaches the network"
      #     true. `MANIFEST.in` fixes that, and this is what keeps it fixed.
      #   * `.leakguard.json` must be PRESENT — it is an ARGUMENT for the leak-guard suite, not
      #     decoration, and a tarball without it ships tests that cannot exercise the injected
      #     configuration this release exists to add. The same failure as the conftest, one
      #     release later.
      #   * `scripts/` must be ABSENT — it no longer exists, and this keeps a re-vendored copy
      #     of the guard from quietly reappearing beside the packaged one. Note that exclusion is
      #     no longer the mechanism that keeps repository names out of published artifacts: the
      #     guard now ships INSIDE the wheel. `tests/test_leak_guard_extraction.py` holds that
      #     line, and this check only keeps a second copy from arriving.
      # All three are one line of `MANIFEST.in` away from regressing, with nothing else watching.
      - name: The sdist carries its fixtures and nothing it should not
        run: |
          set -eu
          sdist="$(ls dist/*.tar.gz)"
          echo "inspecting ${sdist}"
          names="$(tar tzf "$sdist")"
          for required in '/tests/conftest.py' '/.leakguard.json'; do
            echo "$names" | grep -q "${required}\$" || {
              echo "::error::the sdist has no ${required} — its suite ships without something it"
              echo "::error::depends on. Check MANIFEST.in."
              exit 1
            }
          done
          if echo "$names" | grep -q '/scripts/'; then
            echo "::error::the sdist contains scripts/. The leak guard ships as"
            echo "::error::kw_common.leakguard now; a second vendored copy is a fork waiting to"
            echo "::error::happen. Check MANIFEST.in."
            exit 1
          fi
          echo "sdist contents are as intended"
      - name: Install the wheel into a clean environment and import it
        # A throwaway venv, and `--no-index` so nothing can be silently satisfied from PyPI: this
        # asserts the library needs no third-party package at install time either.
        run: |
          set -eu
          python -m venv /tmp/consumer
          /tmp/consumer/bin/python -m pip install --upgrade pip
          /tmp/consumer/bin/python -m pip install --no-index dist/*.whl
          cd /tmp   # away from the source tree, so a passing import cannot come from `src/`
          /tmp/consumer/bin/python -c "
          import kw_common, kw_common.alerting as a, kw_common.leakguard as g
          print('version:', kw_common.__version__)
          print('exports:', len(a.__all__), len(g.__all__))
          assert a.notify and a.AlertSettings and a.configure
          assert g.main and g.cli and g.load_config and g.CONFIG_FILENAME == '.leakguard.json'
          "
      # ⭐ THE CONSOLE SCRIPT IS A SEPARATE CLAIM FROM THE IMPORT, and it is the one a consumer's
      # CI actually depends on. An entry point aimed at the wrong callable installs fine, imports
      # fine, and fails the first time anybody runs it — in their repository, after the tag.
      #
      # ⚠️ RUN AGAINST THIS CHECKOUT FROM AN INSTALLED GUARD. That is the acceptance case the
      # extraction turns on: `site-packages` is not inside this repository, so the self-exemption
      # cannot fire and the tree is cleared by `.leakguard.json` — the injected configuration —
      # or not at all.
      - name: The installed console script scans this repository
        run: |
          set -eu
          /tmp/consumer/bin/kw-leak-guard --selftest
          /tmp/consumer/bin/kw-leak-guard --repo "$GITHUB_WORKSPACE"
